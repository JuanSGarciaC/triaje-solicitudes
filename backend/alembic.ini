# La URL sale de app.config (DATABASE_URL); la API aplica las migraciones al arrancar.
# Nueva migración: alembic revision --autogenerate -m "descripción"
[alembic]
script_location = migrations

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
